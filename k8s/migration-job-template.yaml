apiVersion: batch/v1
kind: Job
metadata:
  # Name should be unique per run or per project
  name: mongodb-migration-${PROJECT_NAME}-${BUILD_ID}
  namespace: mongodb-migrations
  labels:
    app: mongodb-migration
    project: ${PROJECT_NAME}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0 # Do not retry automatically if migration fails, we want to investigate
  template:
    metadata:
      labels:
        app: mongodb-migration
        project: ${PROJECT_NAME}
    spec:
      restartPolicy: Never
      containers:
      - name: migration-runner
        image: ghcr.io/i7ppbeer/mongodb-migrate:latest
        imagePullPolicy: Always
        env:
        - name: PROJECT_NAME
          value: "${PROJECT_NAME}" # e.g., orders, users, analytics
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials-${PROJECT_NAME}
              key: connection-string
        - name: MONGODB_DATABASE
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials-${PROJECT_NAME}
              key: database-name
        - name: SKIP_TESTS
          value: "true" # Skip embedded tests in K8s, rely on CI
        command: ["/usr/local/bin/migration-runner"]
