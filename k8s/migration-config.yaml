---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-config
  namespace: mongodb-migrations
  labels:
    app: mongodb-migration
data:
  # Migration runner configuration
  TEST_VERSIONS: "6.0 7.0 8.0"
  SKIP_TESTS: "false"
  DRY_RUN: "false"
  NODE_ENV: "production"
  
  # Logging
  LOG_LEVEL: "info"
  
  # MongoDB test configuration
  MONGODB_TEST_PORT: "27017"
  
  # Readme
  README: |
    MongoDB Migration Configuration
    ================================
    
    Environment Variables:
    - TEST_VERSIONS: Space-separated list of MongoDB versions to test (default: "6.0 7.0 8.0")
    - SKIP_TESTS: Set to "true" to skip embedded MongoDB testing (default: "false")
    - DRY_RUN: Set to "true" to preview changes without applying (default: "false")
    - MONGODB_URL: Production MongoDB connection string (from Secret)
    - MONGODB_DATABASE: Target database name (from Secret)
    
    Usage:
    1. Ensure mongodb-credentials Secret is created
    2. Apply this ConfigMap: kubectl apply -f migration-config.yaml
    3. Run migration Job: kubectl apply -f migration-job.yaml
    
    Monitor:
    kubectl logs -f job/mongodb-migration -n mongodb-migrations
