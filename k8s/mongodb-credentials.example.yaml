---
# Example Secret for MongoDB Credentials
# DO NOT commit this file with real credentials!
# Use: kubectl create secret generic mongodb-credentials --from-literal=...

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: mongodb-migrations
  labels:
    app: mongodb-migration
type: Opaque
stringData:
  # Production MongoDB connection string
  # Format: mongodb://username:password@host:port/database?options
  MONGODB_URL: "mongodb://admin:password@mongodb-service.production.svc.cluster.local:27017"
  
  # Target database name
  MONGODB_DATABASE: "myapp_production"
  
  # Optional: MongoDB authentication database
  MONGODB_AUTH_DB: "admin"

# ---
# Create secret from command line (recommended):
# kubectl create secret generic mongodb-credentials \
#   --from-literal=MONGODB_URL="mongodb://user:pass@host:27017" \
#   --from-literal=MONGODB_DATABASE="myapp" \
#   -n mongodb-migrations
#
# Or use base64 encoded values:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mongodb-credentials
#   namespace: mongodb-migrations
# type: Opaque
# data:
#   MONGODB_URL: <base64-encoded-connection-string>
#   MONGODB_DATABASE: <base64-encoded-database-name>
