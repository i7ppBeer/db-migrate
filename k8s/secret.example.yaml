# EXAMPLE ONLY — every value below is a placeholder. Do not apply this file
# as-is and do not commit real credentials into git, ever (this repo's own
# db-migrate config.js files read credentials from env vars for exactly this
# reason — the Secret is what supplies those env vars in-cluster).
#
# In a real pipeline, generate this from your secrets manager (Vault,
# External Secrets Operator, sealed-secrets, cloud KMS, whatever you already
# use) rather than a plain `kubectl apply -f` of a checked-in file.
#
# Root/superuser DB credentials do NOT belong here at all in production —
# see docs/DDL-PRODUCTION-SAFETY.md and k8s/README.md: create a dedicated
# "migrator" DB user scoped to exactly the DDL/DML this tool needs on the
# target schema, separate from both the application's runtime user and the
# real database superuser.

apiVersion: v1
kind: Secret
metadata:
  name: db-migrate-{{ project }}-credentials
  namespace: "{{ namespace }}"
type: Opaque
stringData:
  MARIADB_USER: "CHANGE_ME_migrator_user"
  MARIADB_PASSWORD: "CHANGE_ME_replace_with_a_real_secret_from_your_secret_manager"
