apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-rollback
  namespace: mongodb-migrations
  labels:
    app: mongodb-migration
    type: rollback
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mongodb-migration
        type: rollback
    spec:
      restartPolicy: Never
      containers:
      - name: rollback
        image: node:20-alpine
        workingDir: /app
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "⚠️  Starting rollback..."
          npm ci --production
          
          echo "📊 Current migration status:"
          npm run status
          
          echo "⬇️  Rolling back last migration..."
          npm run down
          
          echo "✅ Rollback completed successfully!"
          npm run status
        volumeMounts:
        - name: migration-code
          mountPath: /app
        envFrom:
        - configMapRef:
            name: migration-config
        - secretRef:
            name: mongodb-credentials
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: migration-code
        configMap:
          name: migration-scripts
