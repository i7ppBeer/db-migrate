# ServiceAccount + Role + RoleBinding for the db-migrate Job.
#
# Scoped to exactly one thing: reading the one Secret that holds this
# project's DB credentials. Do NOT run the migration Job under the
# namespace's `default` ServiceAccount — that's usually broader than this
# needs and makes the blast radius of a compromised migration container
# larger than necessary.
#
# Replace {{ project }} with your project name (e.g. "shop").

apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate-{{ project }}-runner
  namespace: "{{ namespace }}"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-migrate-{{ project }}-secret-reader
  namespace: "{{ namespace }}"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["db-migrate-{{ project }}-credentials"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-migrate-{{ project }}-secret-reader-binding
  namespace: "{{ namespace }}"
subjects:
  - kind: ServiceAccount
    name: db-migrate-{{ project }}-runner
    namespace: "{{ namespace }}"
roleRef:
  kind: Role
  name: db-migrate-{{ project }}-secret-reader
  apiGroup: rbac.authorization.k8s.io
