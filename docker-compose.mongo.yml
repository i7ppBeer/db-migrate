version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    network_mode: host
    restart: always

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    network_mode: host
    restart: always
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://127.0.0.1:27017"
      PORT: 8082
