version: '3.8'

services:
  migration-console:
    build:
      context: .
      dockerfile: Dockerfile
      target: console
    image: mongodb-migrate-console:latest
    network_mode: host
    volumes:
      # Mount your projects directory here
      #- ../my-migration-projects/projects:/projects
      - ./databases:/app/databases
      # Mount Docker socket for running tests inside container
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PROJECTS_DIR=/app/databases
    restart: unless-stopped
