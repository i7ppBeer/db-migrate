# ============================================================
# Docker Compose for Database Migration Testing
# Includes: MongoDB, MariaDB, the test-all runner and the `migrate` CLI service
# ============================================================

services:
  # ──────────────────────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: migrate-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=migrate_test
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - migrate-network

  # ──────────────────────────────────────────────────────────
  # MariaDB
  # ──────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: migrate-mariadb
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=migrate_test
      - MYSQL_USER=migrate
      - MYSQL_PASSWORD=migratepass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - migrate-network

  # ──────────────────────────────────────────────────────────
  # Test Runner - Run all tests
  # ──────────────────────────────────────────────────────────
  test-all:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrate-test-all
    depends_on:
      mongodb:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      - DB_TYPE=all
      # MariaDB connection
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=root
      - MARIADB_PASSWORD=rootpass
      # MongoDB connection
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
    volumes:
      - ./test-fixtures:/app/test-fixtures:ro
      - ./reports:/app/reports
    # --sanity-check: also runs every migration with Pre/Post-Checks, incl. the
    # sanity-rollback fixtures whose Post-Check fails by design (real rollback)
    command: ["test-all", "--sanity-check", "-o", "/app/reports", "--pattern", "test-fixtures/**/config.js"]
    networks:
      - migrate-network

  # ──────────────────────────────────────────────────────────
  # Migration CLI Tool - 使用者操作介面
  # 用法:
  #   docker compose run --rm migrate <command> -c <config>
  # 範例:
  #   docker compose run --rm migrate dcl -c /app/test-fixtures/mariadb/my-project/dcl/config.js
  #   docker compose run --rm migrate up -c /app/test-fixtures/mariadb/my-project/ddl/config.js
  #   docker compose run --rm migrate validate -c /app/test-fixtures/mariadb/my-project/ddl/config.js
  #   docker compose run --rm migrate validate-all /app/test-fixtures/mariadb/production-server
  # ──────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrate-cli
    working_dir: /app
    volumes:
      - ./test-fixtures:/app/test-fixtures
      - ./reports:/app/reports
    environment:
      # MariaDB
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=root
      - MARIADB_PASSWORD=rootpass
      # MongoDB
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
    networks:
      - migrate-network
    profiles:
      - tools

volumes:
  mongodb_data:
  mariadb_data:

networks:
  migrate-network:
    driver: bridge
