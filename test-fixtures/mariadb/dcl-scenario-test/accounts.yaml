# DCL Fixture — Day 30: 廢棄 shop_report 與 shop_ddl

accounts:
  - account: shop_api
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE]
        on: ecommerce.*
    alter:
      MAX_QUERIES_PER_HOUR: 2000
      MAX_USER_CONNECTIONS: 10

  - account: shop_report
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT]
        on: ecommerce.orders
      - privileges: [SELECT]
        on: analytics.events
    drop_user: true

  - account: shop_ddl
    description: "Shop DDL Admin"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX]
        on: ecommerce.*
    alter:
      MAX_USER_CONNECTIONS: 3
    revoke:
      - privileges: [DROP, ALTER]
        on: ecommerce.*
    drop_user: true
