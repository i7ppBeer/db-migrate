mode: job

image:
  repository: db-migrate
  tag: "3.0.0"
  pullPolicy: Never          # minikube image load 後用 Never

mongodb:
  enabled: true
  host: mongodb              # Bitnami MongoDB service name
  port: 27017
  database: migrate_test
  auth:
    enabled: false

mariadb:
  enabled: false

ddl:
  enabled: true
  command: up
  sanityCheck:
    enabled: false
    autoRollback: true
    timeoutMs: 30000
  changelogTable: "_migrations"
  changelogCollection: "changelog"
  files:
    20250101000001-create-users.js: |
      export async function up(db, client) {
        await db.createCollection('users', {
          validator: {
            $jsonSchema: {
              bsonType: 'object',
              required: ['email', 'createdAt'],
              properties: {
                email: { bsonType: 'string' },
                name: { bsonType: 'string', maxLength: 100 },
                status: { enum: ['active', 'inactive', 'pending', 'suspended'] },
                createdAt: { bsonType: 'date' },
                updatedAt: { bsonType: 'date' }
              }
            }
          }
        });
        await db.collection('users').createIndex({ email: 1 }, { unique: true, name: 'idx_users_email' });
        await db.collection('users').createIndex({ status: 1, createdAt: -1 }, { name: 'idx_users_status_created' });
        console.log('[MIGRATION] Created users collection');
      }
      export async function down(db, client) {
        await db.collection('users').drop();
        console.log('[MIGRATION] Dropped users collection');
      }

    20250101000002-create-products.js: |
      export async function up(db, client) {
        await db.createCollection('products');
        await db.collection('products').createIndex({ sku: 1 }, { unique: true, name: 'idx_products_sku' });
        await db.collection('products').createIndex({ category: 1, status: 1 }, { name: 'idx_products_category_status' });
        console.log('[MIGRATION] Created products collection');
      }
      export async function down(db, client) {
        await db.collection('products').drop();
        console.log('[MIGRATION] Dropped products collection');
      }

dcl:
  enabled: false

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
