mode: job

image:
  repository: db-migrate
  tag: "3.0.0"
  pullPolicy: Never          # minikube image load 後用 Never

mongodb:
  enabled: false

mariadb:
  enabled: true
  host: mariadb              # Bitnami MariaDB service name
  port: 3306
  database: migrate_test

ddl:
  enabled: true
  command: up
  user: root
  existingSecret: mariadb             # Bitnami 自動建立的 Secret
  secretKey: mariadb-root-password    # Secret 中的 key
  sanityCheck:
    enabled: false
    autoRollback: true
    timeoutMs: 30000
  changelogTable: "_migrations"
  changelogCollection: "changelog"
  files:
    20250101000001-create-users.sql: |
      -- +migrate Up
      CREATE TABLE IF NOT EXISTS users (
          id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
          email VARCHAR(255) NOT NULL,
          name VARCHAR(100),
          password_hash VARCHAR(255) NOT NULL,
          status ENUM('active', 'inactive', 'pending', 'suspended') NOT NULL DEFAULT 'pending',
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          UNIQUE KEY idx_users_email (email),
          KEY idx_users_status (status),
          KEY idx_users_created (created_at)
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
      -- +migrate Down
      DROP TABLE IF EXISTS users;

    20250101000002-seed-users.sql: |
      -- +migrate Up
      INSERT INTO users (id, email, name, password_hash, status, created_at)
      VALUES
          (1, 'admin@example.com', 'System Admin', '$2b$10$placeholder_hash_admin', 'active', '2025-01-01 00:00:00'),
          (2, 'demo@example.com', 'Demo User', '$2b$10$placeholder_hash_demo', 'active', '2025-01-01 00:00:00'),
          (3, 'test@example.com', 'Test User', '$2b$10$placeholder_hash_test', 'pending', '2025-01-01 00:00:00')
      ON DUPLICATE KEY UPDATE
          name = VALUES(name),
          updated_at = CURRENT_TIMESTAMP;
      -- +migrate Down
      DELETE FROM users WHERE id IN (1, 2, 3);

    20250101000003-create-products.sql: |
      -- +migrate Up
      CREATE TABLE IF NOT EXISTS categories (
          id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          slug VARCHAR(100) NOT NULL,
          parent_id INT UNSIGNED,
          sort_order INT DEFAULT 0,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          UNIQUE KEY idx_categories_slug (slug),
          KEY idx_categories_parent (parent_id),
          FOREIGN KEY (parent_id) REFERENCES categories(id) ON DELETE SET NULL
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
      CREATE TABLE IF NOT EXISTS products (
          id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
          sku VARCHAR(20) NOT NULL,
          name VARCHAR(200) NOT NULL,
          description TEXT,
          price DECIMAL(10, 2) NOT NULL,
          category_id INT UNSIGNED,
          status ENUM('draft', 'active', 'discontinued', 'archived') NOT NULL DEFAULT 'draft',
          inventory_quantity INT NOT NULL DEFAULT 0,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          UNIQUE KEY idx_products_sku (sku),
          KEY idx_products_category (category_id),
          KEY idx_products_status (status),
          FOREIGN KEY (category_id) REFERENCES categories(id) ON DELETE SET NULL
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
      -- +migrate Down
      DROP TABLE IF EXISTS products;
      DROP TABLE IF EXISTS categories;

dcl:
  enabled: false

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
