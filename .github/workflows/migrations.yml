# ============================================================
# GitHub Actions - Build & Deploy Migrations
# ============================================================
# Rewritten 2026-09-11: this workflow previously referenced infrastructure
# that was never committed to the repo (Dockerfile.migrations, a multi-stage
# "runner" build target, ./charts/db-migrate Helm chart) and a CLI flag that
# doesn't exist (`validate --database <dir>`), so the test/build jobs would
# fail immediately and the deploy jobs would fail at the `helm upgrade` step
# every time they ran. This version uses the real Dockerfile and the
# kubectl + ConfigMap/Secret/Job pattern documented in k8s/README.md instead
# of Helm. Unverified against a live GitHub Actions run — validate on a real
# PR/staging trigger before trusting it in production, and adjust the
# `env.PROJECT` / secret names below to match your actual project.
#
# IMPORTANT — this file lives in db-migrate's own repo, but the deploy jobs'
# `migrations/ddl` and `config/{staging,production}.config.js` paths are
# NOT db-migrate's own structure (this tool has no top-level migrations/ or
# config/ directory — its own tests use test-fixtures/, referenced correctly
# in the `test` job above). Those two paths are placeholders for whatever
# PROJECT actually consumes this tool and has real migration files + a
# config.js checked in at those locations. If you're copying this workflow
# into a project that uses db-migrate as a dependency, point them at your
# project's real layout; if this is meant to test db-migrate itself end to
# end, replace them with a test-fixtures/ path instead.

name: Build and Deploy Migrations

on:
  push:
    branches: [main, release/*]
    # Release tags (v2.2.0) build the image with version tags 2.2.0 and 2.2;
    # GitHub doesn't apply the paths filter below to tag pushes.
    tags: ['v*']
    # Anything that can change the CI result or the image: code, tests and
    # fixtures, test/lint config, the image's own files, and this workflow.
    # Docs-only commits don't trigger a run.
    paths:
      - 'migrations/**'
      - 'src/**'
      - 'test/**'
      - 'test-fixtures/**'
      - 'Dockerfile*'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package*.json'
      - '*.config.js'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # staging: test, build, deploy to staging only.
      # production: the same, then production (after its manual approval) —
      # production is never deployed without staging first. Run from main
      # (release/* deploys to staging only).
      environment:
        description: 'Deploy to: staging only, or staging then production'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/db-migrate
  # Used to name/label the generated ConfigMaps, Secret, ServiceAccount, and
  # Job in-cluster (see k8s/README.md's {{ project }} placeholder) -- change
  # this to your actual project name.
  PROJECT: app

jobs:
  # ============================================================
  # Job 1: Test & Validate
  # ============================================================
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    # validate-all's DCL path runs a live idempotency check (connect, run
    # twice, diff state) rather than pure static analysis, so it needs real
    # databases reachable at the config defaults' localhost ports below.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: migrate_test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests with coverage; fails if coverage drops below the floors in
      # vitest.config.js (coverage.thresholds)
      - name: Run Tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Validate Migrations
        run: |
          node src/cli.js validate-all test-fixtures/mongodb/test-success
          node src/cli.js validate-all test-fixtures/mariadb/test-success

  # ============================================================
  # Job 2: E2E Test Suite
  # ============================================================
  # Full `test-all` run: builds the real image, brings up MariaDB + MongoDB
  # via docker-compose.yml, and validate+Up-Down-Up/idempotency-tests every
  # config under test-fixtures/**/config.js against them — the same command
  # `npm run docker:test` runs locally. This is the one check that actually
  # exercises migration SQL/JS against real databases end to end; the `test`
  # job above only lints, runs the mocked unit suite, and DCL-verifies two
  # fixtures.
  e2e:
    name: E2E Test Suite
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run full e2e test suite (test-all)
        run: docker compose run --build --rm test-all

      # Integration suite (MariaDB lock guard against a real server), using the
      # mariadb container test-all just started. INTEGRATION_REQUIRE_DB=1 makes
      # an unreachable DB fail the job instead of quietly skipping every test.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # MySQL for test/mysql-compat.test.js: the CLI against a real MySQL 8,
      # so MariaDB-only SQL on the tool's own paths can't slip in unnoticed.
      # The image's init runs a temporary server without networking; the
      # loop waits for the real one (TCP inside the container).
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql-compat -p 3307:3306 -e MYSQL_ROOT_PASSWORD=rootpass mysql:8.4
          for i in $(seq 1 60); do
            docker exec mysql-compat mysql -h127.0.0.1 -uroot -prootpass -e 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs mysql-compat | tail -30
          exit 1

      - name: Run integration tests (real MariaDB + MySQL)
        run: npm run test:integration
        env:
          INTEGRATION_REQUIRE_DB: '1'
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: '3306'
          MARIADB_USER: root
          MARIADB_PASSWORD: rootpass
          MYSQL_REQUIRE_DB: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3307'
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpass

      - name: Upload test-all reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================
  # Job 3: Build Image
  # ============================================================
  build:
    name: Build Image
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A release tag must match package.json's version (or the image would be
      # published under a version number the code doesn't report) and must
      # have its release notes in CHANGELOG.md — checked before anything is
      # pushed, so a tag without notes publishes nothing.
      - name: Check release tag (package.json version, CHANGELOG.md notes)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} — bump package.json (and the CLI's .version()) first, or tag v${pkg}."
            exit 1
          fi
          if ! node scripts/changelog-section.mjs "$tag" > /dev/null; then
            echo "::error::CHANGELOG.md needs a non-empty \"## [${tag}]\" section with the release notes (see Releasing in CHANGELOG.md)."
            exit 1
          fi

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main/release branches: branch name + commit SHA (+ latest on main).
          # Release tags vX.Y.Z: X.Y.Z and X.Y — fixed version tags to pin
          # deployments to (never moved by later main builds).
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # The real Dockerfile is single-stage (src/ + node_modules + entrypoint.sh,
      # see the file itself) -- no separate Dockerfile.migrations, no "runner"
      # build target, no BASE_IMAGE/MIGRATIONS_PATH build-args to pass.
      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tag: ${{ steps.meta.outputs.version }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ============================================================
  # Job 4: GitHub Release (release tags only)
  # ============================================================
  # The tag's CHANGELOG.md section becomes the release notes the team reads;
  # the image's pull command and digest are appended.
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$version" > notes.md
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          {
            echo
            echo '---'
            echo
            echo '### Image'
            echo
            echo '```'
            echo "docker pull ${image}:${version}"
            echo '```'
            echo
            echo "Digest \`${DIGEST}\` — also tagged \`${version%.*}\` and with the commit SHA."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # ============================================================
  # Job 5: Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    # Deploys only once a cluster is wired up: set the repository variable
    # DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions →
    # Variables). Without it these jobs are skipped instead of failing on
    # every push for lack of a kubeconfig/Secret — a permanently red main
    # hides real failures.
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    env:
      NAMESPACE: staging
      CONTENT_HASH: ${{ github.sha }}
      # MariaDB host the Job connects to; defaults to the in-cluster
      # service name k8s/job.yaml already uses. Override per environment
      # with the repository variable STAGING_MARIADB_HOST.
      MARIADB_HOST_OVERRIDE: ${{ vars.STAGING_MARIADB_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Verify credentials Secret exists
        run: |
          if ! kubectl get secret "db-migrate-${PROJECT}-credentials" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "ERROR: db-migrate-${PROJECT}-credentials not found in $NAMESPACE."
            echo "Create it from your secrets manager first -- see k8s/README.md."
            exit 1
          fi

      - name: Apply ServiceAccount + RBAC
        run: |
          sed -e "s/{{ project }}/${PROJECT}/g" -e "s/{{ namespace }}/${NAMESPACE}/g" \
            k8s/serviceaccount-rbac.yaml | kubectl apply -f -

      - name: Generate migrations + config ConfigMaps
        run: |
          kubectl create configmap "db-migrate-${PROJECT}-ddl-migrations-${CONTENT_HASH:0:7}" \
            --from-file=migrations/ddl \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # config.js is non-secret (reads credentials from env vars) -- safe
          # to generate straight from the repo's staging config file.
          kubectl create configmap "db-migrate-${PROJECT}-config" \
            --from-file=config.js=config/staging.config.js \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy migration Job
        run: |
          sed \
            -e "s/{{ project }}/${PROJECT}/g" \
            -e "s/{{ namespace }}/${NAMESPACE}/g" \
            -e "s/{{ contentHash }}/${CONTENT_HASH:0:7}/g" \
            -e "s|your-registry/db-migrate:3.0.1|${REGISTRY}/${IMAGE_NAME}:${{ needs.build.outputs.image_tag }}|g" \
            k8s/job.yaml \
            | sed "s|mariadb\.${NAMESPACE}\.svc\.cluster\.local|${MARIADB_HOST_OVERRIDE:-mariadb.${NAMESPACE}.svc.cluster.local}|g" \
            | kubectl apply -f -

      - name: Wait for Migration Job
        run: |
          kubectl wait --for=condition=complete \
            "job/db-migrate-${PROJECT}-sync-${CONTENT_HASH:0:7}" \
            -n "$NAMESPACE" --timeout=300s

          echo "=== Migration Logs ==="
          kubectl logs "job/db-migrate-${PROJECT}-sync-${CONTENT_HASH:0:7}" -n "$NAMESPACE" --tail=100

  # ============================================================
  # Job 6: Deploy to Production (Manual Approval)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval
    # A manual run deploys to production only when "production" was chosen
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.environment == 'production')
    env:
      NAMESPACE: production
      CONTENT_HASH: ${{ github.sha }}
      MARIADB_HOST_OVERRIDE: ${{ vars.PRODUCTION_MARIADB_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Verify credentials Secret exists
        run: |
          if ! kubectl get secret "db-migrate-${PROJECT}-credentials" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "ERROR: db-migrate-${PROJECT}-credentials not found in $NAMESPACE."
            echo "Please create the secret before deploying (see k8s/README.md)."
            exit 1
          fi

      - name: Apply ServiceAccount + RBAC
        run: |
          sed -e "s/{{ project }}/${PROJECT}/g" -e "s/{{ namespace }}/${NAMESPACE}/g" \
            k8s/serviceaccount-rbac.yaml | kubectl apply -f -

      - name: Generate migrations + config ConfigMaps
        run: |
          kubectl create configmap "db-migrate-${PROJECT}-ddl-migrations-${CONTENT_HASH:0:7}" \
            --from-file=migrations/ddl \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create configmap "db-migrate-${PROJECT}-config" \
            --from-file=config.js=config/production.config.js \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy migration Job
        run: |
          # backoffLimit: 0 is already set in k8s/job.yaml and intentionally
          # NOT overridden here -- see docs/DDL-PRODUCTION-SAFETY.md section
          # 1.8. A failed production DDL migration must stop and be looked
          # at by a human, not be retried automatically by the Job
          # controller against a possibly half-applied state.
          sed \
            -e "s/{{ project }}/${PROJECT}/g" \
            -e "s/{{ namespace }}/${NAMESPACE}/g" \
            -e "s/{{ contentHash }}/${CONTENT_HASH:0:7}/g" \
            -e "s|your-registry/db-migrate:3.0.1|${REGISTRY}/${IMAGE_NAME}:${{ needs.build.outputs.image_tag }}|g" \
            k8s/job.yaml \
            | sed "s|mariadb\.${NAMESPACE}\.svc\.cluster\.local|${MARIADB_HOST_OVERRIDE:-mariadb.${NAMESPACE}.svc.cluster.local}|g" \
            | kubectl apply -f -

      - name: Wait for Migration Job
        run: |
          kubectl wait --for=condition=complete \
            "job/db-migrate-${PROJECT}-sync-${CONTENT_HASH:0:7}" \
            -n "$NAMESPACE" --timeout=600s

          echo "=== Migration Completed Successfully ==="
          kubectl logs "job/db-migrate-${PROJECT}-sync-${CONTENT_HASH:0:7}" -n "$NAMESPACE" --tail=200
