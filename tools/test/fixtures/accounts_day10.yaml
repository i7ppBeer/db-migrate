# DCL Fixture — Day 10: shop_ddl revoke DROP/ALTER；shop_api reset_pwd
# 變更:
#   - shop_api  : reset_pwd: true (強制密碼輪換)
#   - shop_ddl  : revoke DROP, ALTER (安全審計)

accounts:
  - account: shop_api
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE]
        on: ecommerce.*
    alter:
      MAX_QUERIES_PER_HOUR: 2000
      MAX_USER_CONNECTIONS: 10
    reset_pwd: true

  - account: shop_report
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT]
        on: ecommerce.orders
      - privileges: [SELECT]
        on: analytics.events

  - account: shop_ddl
    description: "Shop DDL Admin"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX]
        on: ecommerce.*
    alter:
      MAX_USER_CONNECTIONS: 3
    revoke:
      - privileges: [DROP, ALTER]
        on: ecommerce.*
