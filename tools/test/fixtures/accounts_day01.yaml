# DCL Fixture — Day 1: 新增三個電商服務帳號
# 測試重點:
#   - shop_api   : db-level DML，alter resource limits
#   - shop_report: table-level SELECT (ecommerce.orders 只)
#   - shop_ddl   : db-level 完整 DDL，alter MAX_USER_CONNECTIONS

accounts:
  - account: shop_api
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE]
        on: ecommerce.*
    alter:
      MAX_QUERIES_PER_HOUR: 2000
      MAX_USER_CONNECTIONS: 10

  - account: shop_report
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT]
        on: ecommerce.orders        # table-level: 只授權 orders，customers 未授權

  - account: shop_ddl
    description: "Shop DDL Admin"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX]
        on: ecommerce.*
    alter:
      MAX_USER_CONNECTIONS: 3
