# DCL Fixture — Day 5: shop_report 擴充到 analytics (仍 table-level)
# 變更: 新增 SELECT ON analytics.events

accounts:
  - account: shop_api
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE]
        on: ecommerce.*
    alter:
      MAX_QUERIES_PER_HOUR: 2000
      MAX_USER_CONNECTIONS: 10

  - account: shop_report
    description: "Shop Service Accounts"
    grants:
      - privileges: [SELECT]
        on: ecommerce.orders
      - privileges: [SELECT]
        on: analytics.events        # 新增: analytics table-level

  - account: shop_ddl
    description: "Shop DDL Admin"
    grants:
      - privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX]
        on: ecommerce.*
    alter:
      MAX_USER_CONNECTIONS: 3
