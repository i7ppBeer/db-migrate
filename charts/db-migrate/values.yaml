# ============================================================
# DB-Migrate Helm Chart Values
# ============================================================
#
# 快速開始:
#
#   # MongoDB DDL — Job mode
#   helm install my-migration ./charts/db-migrate \
#     --set mongodb.enabled=true \
#     --set mongodb.host=mongodb --set mongodb.database=myapp \
#     --set-file ddl.files.20260101000001-create-users\\.js=migrations/20260101000001-create-users.js
#
#   # MariaDB DDL + DCL — Job mode
#   kubectl create secret generic ddl-secret --from-literal=password=<pw>
#   kubectl create secret generic dcl-secret --from-literal=password=<pw>
#   helm install my-migration ./charts/db-migrate \
#     --set mongodb.enabled=false --set mariadb.enabled=true \
#     --set mariadb.host=mariadb --set mariadb.database=myapp \
#     --set ddl.user=migrate --set ddl.existingSecret=ddl-secret \
#     --set dcl.enabled=true --set dcl.user=root --set dcl.existingSecret=dcl-secret
#
#   # Deployment mode (sleep infinity, exec in to run)
#   helm install my-migration ./charts/db-migrate \
#     --set mode=deployment --set mongodb.host=mongodb
#
# ============================================================

# --- Work mode ---
# job        = one-shot Helm hook Job (runs on install/upgrade)
# deployment = long-running pod (sleep infinity), exec in to run commands
mode: job

# --- Global ---
global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- Image ---
image:
  repository: db-migrate
  tag: "2.1.0"
  pullPolicy: IfNotPresent

# ============================================================
# Database — enable exactly one
# ============================================================

mongodb:
  enabled: true
  host: mongodb
  port: 27017
  database: myapp

  auth:
    enabled: false
    username: ""
    existingSecret: ""          # key: mongodb-password
    secretKey: "mongodb-password"

  options:
    replicaSet: ""
    tls: false
    authSource: "admin"

mariadb:
  enabled: false
  host: mariadb
  port: 3306
  database: myapp

  options:
    connectTimeout: 10000
    charset: "utf8mb4"
    ssl: false

# ============================================================
# DDL — versioned schema migrations
# ============================================================
ddl:
  enabled: true
  command: up                     # up | down | status | validate | test

  # DB credentials (MariaDB only; MongoDB uses mongodb.auth)
  user: ""
  existingSecret: ""              # key: password
  secretKey: "password"

  sanityCheck:
    enabled: false
    autoRollback: true
    timeoutMs: 30000

  changelogTable: "_migrations"         # MariaDB
  changelogCollection: "changelog"      # MongoDB

  # Migration files — embedded in ConfigMap
  # key = filename, value = file content
  files: {}
  #   20260101000001-create-users.sql: |
  #     -- +migrate Up
  #     CREATE TABLE IF NOT EXISTS users (
  #       id INT AUTO_INCREMENT PRIMARY KEY,
  #       name VARCHAR(255) NOT NULL
  #     );
  #     -- +migrate Down
  #     DROP TABLE IF EXISTS users;

# ============================================================
# DCL — repeatable permission / user migrations
# ============================================================
dcl:
  enabled: false
  command: dcl                    # dcl | dcl:status | dcl:verify

  # DB credentials (MariaDB only)
  user: ""
  existingSecret: ""              # key: password
  secretKey: "password"

  database: "mysql"               # DCL usually targets 'mysql' system DB
  checksumTable: "_dcl_migrations"

  # Migration files — embedded in ConfigMap
  files: {}
  #   R__01_readonly_user.sql: |
  #     CREATE USER IF NOT EXISTS 'reader'@'%' IDENTIFIED BY 'xxx';
  #     GRANT SELECT ON myapp.* TO 'reader'@'%';

# ============================================================
# Job settings (mode=job only)
# ============================================================
job:
  restartPolicy: Never
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 300
  annotations: {}
  podAnnotations: {}

# ============================================================
# Deployment settings (mode=deployment only)
# ============================================================
deployment:
  replicas: 1
  annotations: {}
  podAnnotations: {}

# ============================================================
# Resources
# ============================================================
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ============================================================
# Security
# ============================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

# ============================================================
# ServiceAccount
# ============================================================
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ============================================================
# Scheduling
# ============================================================
nodeSelector: {}
tolerations: []
affinity: {}
