{{- if .Values.ddl.enabled }}
{{- $fullname := include "db-migrate.fullname" . -}}
{{- $isJob := eq .Values.mode "job" -}}
{{- $isMongo := .Values.mongodb.enabled -}}
apiVersion: {{ if $isJob }}batch/v1{{ else }}apps/v1{{ end }}
kind: {{ if $isJob }}Job{{ else }}Deployment{{ end }}
metadata:
  name: {{ $fullname }}-ddl
  labels:
    {{- include "db-migrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ddl
  {{- if $isJob }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if $isJob }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- else }}
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "db-migrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ddl
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "db-migrate.labels" . | nindent 8 }}
        app.kubernetes.io/component: ddl
      annotations:
        {{- if .Values.ddl.files }}
        checksum/config: {{ toJson .Values.ddl.files | sha256sum }}
        {{- end }}
        {{- if $isJob }}
        {{- with .Values.job.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "db-migrate.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $isJob }}
      restartPolicy: {{ .Values.job.restartPolicy }}
      {{- end }}
      containers:
        - name: ddl
          image: "{{ .Values.global.imageRegistry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $isJob }}
          command: ["/app/docker/entrypoint.sh"]
          args: ["{{ .Values.ddl.command }}"]
          {{- else }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/docker/entrypoint.sh {{ .Values.ddl.command }}
              echo "DDL migration completed. Sleeping..."
              sleep infinity
          {{- end }}
          env:
            {{- if $isMongo }}
            - name: DB_TYPE
              value: "mongodb"
            - name: DB_HOST
              value: {{ .Values.mongodb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.mongodb.port | quote }}
            - name: DB_NAME
              value: {{ .Values.mongodb.database | quote }}
            {{- if .Values.mongodb.auth.enabled }}
            - name: DB_USER
              value: {{ .Values.mongodb.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret }}
                  key: {{ .Values.mongodb.auth.secretKey }}
            {{- end }}
            {{- else }}
            - name: DB_TYPE
              value: "mariadb"
            - name: DB_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.mariadb.port | quote }}
            - name: DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: DB_USER
              value: {{ .Values.ddl.user | quote }}
            {{- if .Values.ddl.existingSecret }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ddl.existingSecret }}
                  key: {{ .Values.ddl.secretKey }}
            {{- end }}
            {{- end }}
            - name: MIGRATION_MODE
              value: "ddl"
            - name: CHANGELOG_TABLE
              value: {{ .Values.ddl.changelogTable | quote }}
            - name: CHANGELOG_COLLECTION
              value: {{ .Values.ddl.changelogCollection | quote }}
            - name: SANITY_CHECK_ENABLED
              value: {{ .Values.ddl.sanityCheck.enabled | quote }}
            - name: SANITY_CHECK_AUTO_ROLLBACK
              value: {{ .Values.ddl.sanityCheck.autoRollback | quote }}
            - name: SANITY_CHECK_TIMEOUT
              value: {{ .Values.ddl.sanityCheck.timeoutMs | quote }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
            {{- if .Values.ddl.files }}
            - name: migrations
              mountPath: /app/migrations
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          emptyDir: {}
        {{- if .Values.ddl.files }}
        - name: migrations
          configMap:
            name: {{ $fullname }}-ddl
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
