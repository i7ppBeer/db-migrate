{{/*
  Database passwords MUST be provided via existing Kubernetes Secrets.
  This chart does NOT create secrets automatically for security reasons.
  
  Before deploying, create secrets:
  
  For MongoDB:
    kubectl create secret generic my-mongodb-secret \
      --from-literal=mongodb-password=<your-password>
  
  For MariaDB:
    kubectl create secret generic my-mariadb-secret \
      --from-literal=mariadb-password=<your-password>
  
  Then reference in values:
    mongodb.auth.existingSecret: my-mongodb-secret
    mariadb.existingSecret: my-mariadb-secret
*/}}
