{{- if .Values.job.enabled }}
{{/*
  Support for multiple MongoDB instances.
  If mongodb.instances is defined, create one Job per instance.
  Otherwise, use the single mongodb configuration.
*/}}

{{- if and .Values.mongodb.enabled .Values.mongodb.instances }}
{{/* Multi-instance mode: create a Job for each instance */}}
{{- range $index, $instance := .Values.mongodb.instances }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "db-migrate.fullname" $ }}-{{ $instance.name }}-{{ $.Release.Revision }}
  labels:
    {{- include "db-migrate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: migration-job
    db-migrate/instance: {{ $instance.name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with $.Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $.Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ $.Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if $.Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ $.Values.job.activeDeadlineSeconds }}
  {{- end }}
  backoffLimit: {{ $.Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "db-migrate.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: migration-job
        db-migrate/instance: {{ $instance.name }}
      {{- with $.Values.job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "db-migrate.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      restartPolicy: {{ $.Values.job.restartPolicy }}
      containers:
        - name: migration
          image: "{{ $.Values.global.imageRegistry }}{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          command:
            - /entrypoint.sh
            - {{ $.Values.migration.command }}
            {{- if eq $.Values.migration.command "down" }}
            - "-n"
            - "{{ $.Values.migration.downCount }}"
            {{- end }}
          env:
            - name: DB_TYPE
              value: "mongodb"
            - name: DB_HOST
              value: {{ $instance.host | quote }}
            - name: DB_PORT
              value: {{ $instance.port | default 27017 | quote }}
            - name: DB_NAME
              value: {{ $instance.database | quote }}
            {{- if $instance.auth }}
            {{- if $instance.auth.enabled }}
            - name: DB_USER
              value: {{ $instance.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "mongodb.instances[%d].auth.existingSecret is required" $index) $instance.auth.existingSecret }}
                  key: {{ $instance.auth.secretKey | default "mongodb-password" }}
            {{- end }}
            {{- end }}
            - name: MIGRATIONS_DIR
              value: {{ $.Values.migration.directory | quote }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $.Values.customMigrations.enabled }}
            {{- if $.Values.customMigrations.configMapName }}
            - name: migrations
              mountPath: {{ $.Values.migration.directory }}
            {{- end }}
            {{- if $.Values.customMigrations.pvcName }}
            - name: migrations-pvc
              mountPath: {{ $.Values.migration.directory }}
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $.Values.customMigrations.enabled }}
        {{- if $.Values.customMigrations.configMapName }}
        - name: migrations
          configMap:
            name: {{ $.Values.customMigrations.configMapName }}
        {{- end }}
        {{- if $.Values.customMigrations.pvcName }}
        - name: migrations-pvc
          persistentVolumeClaim:
            claimName: {{ $.Values.customMigrations.pvcName }}
        {{- end }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- else }}
{{/* Single instance mode (original behavior) */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "db-migrate.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "db-migrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-job
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  {{- end }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "db-migrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-job
      {{- with .Values.job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "db-migrate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      restartPolicy: {{ .Values.job.restartPolicy }}
      containers:
        - name: migration
          image: "{{ .Values.global.imageRegistry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          command:
            - /entrypoint.sh
            - {{ .Values.migration.command }}
            {{- if eq .Values.migration.command "down" }}
            - "-n"
            - "{{ .Values.migration.downCount }}"
            {{- end }}
          env:
            - name: DB_TYPE
              value: {{ include "db-migrate.dbType" . | quote }}
            {{- if .Values.mongodb.enabled }}
            - name: DB_HOST
              value: {{ .Values.mongodb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.mongodb.port | quote }}
            - name: DB_NAME
              value: {{ .Values.mongodb.database | quote }}
            {{- if .Values.mongodb.auth.enabled }}
            - name: DB_USER
              value: {{ .Values.mongodb.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "mongodb.auth.existingSecret is required when auth is enabled" .Values.mongodb.auth.existingSecret }}
                  key: {{ .Values.mongodb.auth.secretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.mariadb.enabled }}
            - name: DB_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.mariadb.port | quote }}
            - name: DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: DB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "mariadb.existingSecret is required when mariadb is enabled" .Values.mariadb.existingSecret }}
                  key: {{ .Values.mariadb.secretKey }}
            {{- end }}
            - name: MIGRATIONS_DIR
              value: {{ .Values.migration.directory | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.customMigrations.enabled }}
            {{- if .Values.customMigrations.configMapName }}
            - name: migrations
              mountPath: {{ .Values.migration.directory }}
            {{- end }}
            {{- if .Values.customMigrations.pvcName }}
            - name: migrations-pvc
              mountPath: {{ .Values.migration.directory }}
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.customMigrations.enabled }}
        {{- if .Values.customMigrations.configMapName }}
        - name: migrations
          configMap:
            name: {{ .Values.customMigrations.configMapName }}
        {{- end }}
        {{- if .Values.customMigrations.pvcName }}
        - name: migrations-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.customMigrations.pvcName }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
