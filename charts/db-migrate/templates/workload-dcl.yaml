{{- if .Values.dcl.enabled }}
{{- $fullname := include "db-migrate.fullname" . -}}
{{- $isJob := eq .Values.mode "job" -}}
apiVersion: {{ if $isJob }}batch/v1{{ else }}apps/v1{{ end }}
kind: {{ if $isJob }}Job{{ else }}Deployment{{ end }}
metadata:
  name: {{ $fullname }}-dcl
  labels:
    {{- include "db-migrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: dcl
  {{- if $isJob }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if $isJob }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- else }}
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "db-migrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dcl
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "db-migrate.labels" . | nindent 8 }}
        app.kubernetes.io/component: dcl
      annotations:
        {{- if .Values.dcl.files }}
        checksum/config: {{ toJson .Values.dcl.files | sha256sum }}
        {{- end }}
        {{- if $isJob }}
        {{- with .Values.job.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "db-migrate.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $isJob }}
      restartPolicy: {{ .Values.job.restartPolicy }}
      {{- end }}
      containers:
        - name: dcl
          image: "{{ .Values.global.imageRegistry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $isJob }}
          command: ["/app/docker/entrypoint.sh"]
          args: ["{{ .Values.dcl.command }}"]
          {{- else }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/docker/entrypoint.sh {{ .Values.dcl.command }}
              echo "DCL migration completed. Sleeping..."
              sleep infinity
          {{- end }}
          env:
            - name: DB_TYPE
              value: "mariadb"
            - name: DB_HOST
              value: {{ .Values.mariadb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.mariadb.port | quote }}
            - name: DB_NAME
              value: {{ .Values.dcl.database | quote }}
            - name: DB_USER
              value: {{ .Values.dcl.user | quote }}
            {{- if .Values.dcl.existingSecret }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dcl.existingSecret }}
                  key: {{ .Values.dcl.secretKey }}
            {{- end }}
            - name: MIGRATION_MODE
              value: "dcl"
            - name: CHECKSUM_TABLE
              value: {{ .Values.dcl.checksumTable | quote }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
            {{- if .Values.dcl.files }}
            - name: migrations
              mountPath: /app/migrations
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          emptyDir: {}
        {{- if .Values.dcl.files }}
        - name: migrations
          configMap:
            name: {{ $fullname }}-dcl
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
