trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CI
  displayName: 'CI: Test Migrations'
  jobs:
  - job: Test
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

    - script: |
        npm run lint
      displayName: 'Lint Code'

    - script: |
        chmod +x scripts/test-all-migrations.sh
        ./scripts/test-all-migrations.sh
      displayName: 'Run Migration Tests (Up -> Down -> Up)'

- stage: CD
  displayName: 'CD: Build and Push'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: 'MyDockerConnection' # Replace with your service connection
        repository: 'mongodb-migrate'
        dockerfile: 'Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
